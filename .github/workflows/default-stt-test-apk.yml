name: Default STT Test APK

on:
  push:
    branches:
      - tools/default-stt-test-v1
    paths:
      - "tools/android-default-stt-test/**"
      - ".github/workflows/default-stt-test-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/android-default-stt-test/**"
      - ".github/workflows/default-stt-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Mark utility build started
        if: github.event_name == 'push'
        run: |
          mkdir -p artifacts
          printf 'started %s\n' "$GITHUB_SHA" > artifacts/build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/build-status.txt
          git commit -m "Mark default STT APK build started"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build and lint
        working-directory: tools/android-default-stt-test
        run: gradle --no-daemon clean assembleDebug lintDebug

      - name: Verify default recognizer path
        run: |
          grep -q "SpeechRecognizer.createSpeechRecognizer(this)" tools/android-default-stt-test/app/src/main/java/dev/pocket/stttest/MainActivity.java
          test -f tools/android-default-stt-test/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-default-stt-test-apk
          path: tools/android-default-stt-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable APK on utility branch
        if: github.event_name == 'push'
        run: |
          cp tools/android-default-stt-test/app/build/outputs/apk/debug/app-debug.apk artifacts/android-default-stt-test.apk
          printf 'success %s\n' "$GITHUB_SHA" > artifacts/build-status.txt
          git add artifacts/android-default-stt-test.apk artifacts/build-status.txt
          git commit -m "Publish default STT test APK"
          git push origin "HEAD:${GITHUB_REF_NAME}"
