name: Publish voice preview APK
on:
  push:
    branches: ['feat/deepgram-voice-assistant']
    paths: ['.github/workflows/publish-voice-preview.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocket-agent-release
          run-id: 38785226512
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify signed source and release ARM64 preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ru-aish/pocket-agent
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat artifacts/source-commit.txt)" = "412905e534f105f9e2b4c7fb2177e0fa89e2a6cc"
          expected="$(awk '$2=="artifacts/Pocket-Agent-arm64.apk" {print $1}' artifacts/SHA256SUMS.txt)"
          test -n "$expected"
          actual="$(sha256sum artifacts/Pocket-Agent-arm64.apk | cut -d' ' -f1)"
          test "$actual" = "$expected"
          gh release create v0.1.3-voice-preview.1 \
            "artifacts/Pocket-Agent-arm64.apk#Pocket-Agent-Voice-Background-arm64.apk" \
            --target 412905e534f105f9e2b4c7fb2177e0fa89e2a6cc \
            --prerelease \
            --title "Pocket Agent Voice Background Preview 0.1.3" \
            --notes "Signed ARM64 background-voice preview from GitHub Actions run 38785226512. Android assistant invocation starts a microphone foreground service with an ongoing notification instead of an overlay. Listening continues while other apps are open and during spoken replies. Flux StartOfTurn interrupts old playback and TTS receives Clear; six seconds of idle silence stops microphone, while Pi workers continue. Five targeted Android emulator instrumentation tests passed. Grant microphone and notification permissions; configure Deepgram and model provider. Physical-device full-duplex echo/acoustic behavior still requires user testing."
