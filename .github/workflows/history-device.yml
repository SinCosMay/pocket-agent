name: History device validation APKs
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: history-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      # This artifact intentionally checks the history and shared-runtime suites only.
      # Android SQLite and the embedded compatibility gate run in focused instrumentation below.
      - name: Build and check focused history/runtime suites
        working-directory: runtime
        run: |
          npm ci
          node --import tsx --test --test-concurrency=1 test/memory.test.ts test/runtime.test.ts
          npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build isolated phone test APK pair
        run: ./gradlew --no-daemon -PisolatedDeviceValidation :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Record provenance
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk artifacts/Pocket-Agent-history-arm64.apk
          cp app/build/outputs/apk/androidTest/debug/*.apk artifacts/Pocket-Agent-history-tests.apk
          git rev-parse HEAD > artifacts/source-commit.txt
          cp app/src/main/assets/runtime-manifest.json artifacts/runtime-manifest.json
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Validate history on Android while keeping USB testing separate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r artifacts/Pocket-Agent-history-tests.apk
            adb shell am instrument -w -r -e class dev.pocket.agent.ConversationHistoryDeviceTest,dev.pocket.agent.ConversationHistoryLoopDeviceTest dev.pocket.agent.historyvalidation.test/androidx.test.runner.AndroidJUnitRunner > artifacts/android-history-results.txt
            cat artifacts/android-history-results.txt
            grep -q 'OK (' artifacts/android-history-results.txt && ! grep -q 'FAILURES!!!' artifacts/android-history-results.txt
      - name: Preserve instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: history-device-failure-evidence
          path: artifacts/android-history-results.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: pocket-agent-history-device
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
