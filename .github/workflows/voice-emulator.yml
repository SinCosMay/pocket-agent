name: Voice capture emulator
on:
  pull_request:
    paths:
      - '.github/workflows/voice-emulator.yml'
      - 'app/src/main/java/dev/pocket/agent/DeepgramVoice.java'
      - 'app/src/main/java/dev/pocket/agent/PcmCaptureQueue.java'
      - 'app/src/main/java/dev/pocket/agent/VoiceListeningService.java'
      - 'app/src/androidTest/java/dev/pocket/agent/InstantVoiceCaptureDeviceTest.java'
      - 'app/proguard-rules.pro'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APK_KEYSTORE: /tmp/pocket-agent-voice-test-signing.jks
      APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
      APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Restore private signing for release instrumentation
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['APK_KEYSTORE'])
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow hardware-assisted emulator execution
        run: sudo chmod 666 /dev/kvm
      - name: Instrument real microphone capture and delayed socket replay
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-audio
          script: ./gradlew --no-daemon :app:connectedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pocket.agent.InstantVoiceCaptureDeviceTest
      - name: Publish emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-capture-emulator-tests
          path: app/build/outputs/androidTest-results/connected/
          retention-days: 30
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f "$APK_KEYSTORE"
