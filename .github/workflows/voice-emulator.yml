name: Voice capture emulator
on:
  pull_request:
    paths:
      - '.github/workflows/voice-emulator.yml'
      - '.github/scripts/run-voice-emulator-tests.sh'
      - 'scripts/live_deepgram_barge_in.py'
      - 'gradlew'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'app/src/main/java/dev/pocket/agent/DeepgramVoice.java'
      - 'app/src/main/java/dev/pocket/agent/PcmCaptureQueue.java'
      - 'app/src/main/java/dev/pocket/agent/VoiceListeningService.java'
      - 'app/src/main/java/dev/pocket/agent/AndroidShortSpeechRecognizer.java'
      - 'app/src/main/java/dev/pocket/agent/AndroidDefaultSpeechRecognizer.java'
      - 'app/src/main/java/dev/pocket/agent/HybridTranscriptArbiter.java'
      - 'app/src/main/java/dev/pocket/agent/VoiceSttSettings.java'
      - 'app/src/main/java/dev/pocket/agent/JarvisDetector.java'
      - 'app/src/main/java/dev/pocket/agent/JarvisProfile.java'
      - 'app/src/main/java/dev/pocket/agent/WakeWordService.java'
      - 'app/src/main/java/dev/pocket/agent/WakeAcknowledgementSound.java'
      - 'app/src/main/java/dev/pocket/agent/WakeWordSettings.java'
      - 'app/src/main/java/dev/pocket/agent/MainActivity.java'
      - 'app/src/main/java/dev/pocket/agent/JarvisEnrollmentActivity.java'
      - 'app/src/androidTest/java/dev/pocket/agent/WakeWordSettingsDeviceTest.java'
      - 'app/src/androidTest/java/dev/pocket/agent/JarvisDetectorDeviceTest.java'
      - 'app/src/androidTest/java/dev/pocket/agent/JarvisWakeLifecycleDeviceTest.java'
      - 'app/src/androidTest/java/dev/pocket/agent/WakeAcknowledgementSoundDeviceTest.java'
      - 'app/src/androidTest/assets/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/proguard-rules.pro'
      - 'app/src/main/assets/wakeword/**'
      - 'app/src/main/res/raw/jarvis_ack.wav'
      - 'app/build.gradle.kts'
      - 'app/src/androidTest/java/dev/pocket/agent/InstantVoiceCaptureDeviceTest.java'
      - 'app/src/androidTest/java/dev/pocket/agent/HybridSttDeviceTest.java'
      - 'app/src/androidTest/java/dev/pocket/agent/VoiceSttSettingsDeviceTest.java'
  workflow_dispatch:
    inputs:
      live_only:
        description: Run only the cheap live Deepgram barge-in probe
        required: false
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: voice-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Deepgram barge-in protocol
        run: |
          python3 -m pip install --disable-pip-version-check --quiet aiohttp==3.13.5
          python3 scripts/live_deepgram_barge_in.py | tee live-deepgram-barge-in.json
      - uses: actions/setup-java@v4
        if: github.event_name != 'workflow_dispatch' || inputs.live_only != true
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: github.event_name != 'workflow_dispatch' || inputs.live_only != true
      - if: github.event_name != 'workflow_dispatch' || inputs.live_only != true
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'workflow_dispatch' || inputs.live_only != true
      - name: Allow hardware-assisted emulator execution
        if: github.event_name != 'workflow_dispatch' || inputs.live_only != true
        run: sudo chmod 666 /dev/kvm
      - name: Test local Jarvis inference and delayed Deepgram microphone capture
        if: github.event_name != 'workflow_dispatch' || inputs.live_only != true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash .github/scripts/run-voice-emulator-tests.sh
      - name: Publish emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-capture-emulator-tests
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/voice-emulator-test-evidence/
            live-deepgram-barge-in.json
          retention-days: 30
          if-no-files-found: ignore
